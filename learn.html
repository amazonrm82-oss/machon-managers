      var text = formValue('fileReview', 'שורה-שתיים', '');
      if (!text.trim()) { toast('אין מה לשמור — ההערה ריקה'); return; }
      state.records.notes.push({ day: v.day, by: MANAGER, text: text });
      clearForms('fileReview/');
      set({ screen: 'admin' }, { top: true });
      toast('הערת הסיכום נשמרה בתיק');
    },

    /* -------------------------------------------------- curriculum builder */

    curAdd: function (arg) {
      var c = editableCurriculum();
      c.stages[Number(arg)].chapters.push('פרק חדש');
      set({}, { top: false });
    },

    curRemove: function (arg) {
      var p = arg.split(':'), c = editableCurriculum();
      c.stages[Number(p[0])].chapters.splice(Number(p[1]), 1);
      set({});
    },

    curMove: function (arg) {
      var p = arg.split(':'), c = editableCurriculum();
      var list = c.stages[Number(p[0])].chapters;
      var from = Number(p[1]), to = from + Number(p[2]);
      if (to < 0 || to >= list.length) return;
      var moved = list.splice(from, 1)[0];
      list.splice(to, 0, moved);
      set({});
    },

    curAddStage: function () {
      var c = editableCurriculum();
      c.stages.push({ title: 'שלב חדש', days: '', hours: '', chapters: ['פרק חדש'] });
      set({});
    },

    curRemoveStage: function (arg) {
      var c = editableCurriculum();
      if (c.stages.length <= 1) { toast('חייב להישאר לפחות שלב אחד'); return; }
      c.stages.splice(Number(arg), 1);
      set({});
    },

    curAddTrack: function (arg) {
      var c = editableCurriculum();
      c.tracks[arg].chapters.push('פרק חדש');
      set({});
    },

    curRemoveTrack: function (arg) {
      var p = arg.split(':'), c = editableCurriculum();
      c.tracks[p[0]].chapters.splice(Number(p[1]), 1);
      set({});
    },

    curReset: function () {
      state.curriculum = null;
      save();
      render();
      toast('התוכנית חזרה למקור');
    },

    curDone: function () {
      set({ screen: 'coordinator' }, { top: true });
      toast('תוכנית הלימודים עודכנה');
    },

    print: function () { window.print(); },

    account: function () { accountOpen = !accountOpen; render(); },

    signOut: function () {
      accountOpen = false;
      if (authApi && authApi.signOut) authApi.signOut();
      else location.reload();
    },

    toast: function (arg) { toast(arg); }
  };

  /* ------------------------------------------------------------ form state

     Every field on every screen is persisted without each screen having to
     opt in. After a render, each input/select/textarea is given a stable key
     built from the screen, the instance it belongs to (which chapter's test,
     whose file) and the field's own label — so the same question keeps its
     answer, and the same question on a different chapter does not collide.
     Values are written back on input, which never re-renders, so typing is
     never interrupted. */

  function instanceOf(v) {
    switch (v.screen) {
      case 'test': case 'lesson': return v.current.id;
      case 'review': return v.reviewChapter.id;
      case 'managerTest': return v.name + '/' + v.toMark.id;
      case 'observation': case 'stageMeeting': case 'fileReview': return v.name + '/' + v.stageIdx;
      default: return '';
    }
  }

  function labelOf(el) {
    var lab = el.closest('label');
    var text = '';
    if (lab) {
      // The label's own words only. Reading textContent directly would sweep
      // in whatever is typed into the field, and the key would then change on
      // every keystroke — orphaning what was already saved.
      var copy = lab.cloneNode(true);
      var controls = copy.querySelectorAll('input, select, textarea');
      for (var i = 0; i < controls.length; i++) controls[i].remove();
      text = (copy.textContent || '').trim();
    }
    if (!text) {
      var q = el.closest('.qa, .card, .stack');
      var qt = q && q.querySelector('.qtext, .label');
      if (qt) text = qt.textContent.trim();
    }
    if (!text) text = el.getAttribute('placeholder') || el.getAttribute('aria-label') || el.tagName;
    return text.replace(/\s+/g, ' ').slice(0, 60);
  }

  function fieldKey(v, el, seen) {
    var base = v.screen + '/' + instanceOf(v) + '|' + labelOf(el);
    seen[base] = (seen[base] || 0) + 1;
    return base + '#' + seen[base];
  }

  function bindForms(v) {
    var seen = {};
    var fields = root.querySelectorAll('input, select, textarea');
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.getAttribute('data-bind')) continue;      // handled separately (the name field)
      if (el.getAttribute('data-cur')) continue;       // the curriculum builder writes by path
      if (el.closest('.demobar')) continue;
      var key = fieldKey(v, el, seen);
      el.setAttribute('data-field', key);
      if (!(key in state.forms)) continue;
      var saved = state.forms[key];
      if (el.type === 'checkbox') el.checked = !!saved;
      else if (saved !== '' && saved != null) el.value = saved;
    }
  }

  /* Reads a saved field by screen and a fragment of its label. */
  function formValue(screenName, labelFragment, fallback) {
    for (var k in state.forms) {
      if (k.indexOf(screenName + '/') !== 0) continue;
      if (k.indexOf(labelFragment) === -1) continue;
      var val = state.forms[k];
      if (val !== '' && val != null) return val;
    }
    return fallback === undefined ? '' : fallback;
  }

  /* All saved answers for one screen instance, in the order they appear. */
  function formsFor(prefix) {
    return Object.keys(state.forms)
      .filter(function (k) { return k.indexOf(prefix) === 0; })
      .map(function (k) { return { key: k, label: k.split('|')[1].replace(/#\d+$/, ''), value: state.forms[k] }; })
      .filter(function (e) { return String(e.value).trim() !== ''; });
  }

  function clearForms(prefix) {
    Object.keys(state.forms).forEach(function (k) { if (k.indexOf(prefix) === 0) delete state.forms[k]; });
  }

  /* ----------------------------------------------------------------- toast */

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el || !msg) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  /* ---------------------------------------------------------------- render */

  var root = null;

  function render(opts) {
    opts = opts || {};
    if (!root) root = document.getElementById('root');
    var v = derive();

    document.documentElement.lang = v.lang === 'en' ? 'en' : 'he';
    document.documentElement.dir = 'rtl'; // content is authored in Hebrew in both modes
    document.body.classList.toggle('preview-phone', state.preview === 'phone');

    var screenFn = screens[v.screen] || screens.home;
    var body = screenFn(v);

    var html = demobar(v) +
      '<div class="shell"><div class="app">' +
      (v.isPhone ? mobilebar(v) : topbar(v)) +
      body +
      (v.isPhone ? tabbar(v) : '') +
      '</div></div>';

    root.innerHTML = html;
    bindForms(v);

    if (opts.top && typeof window !== 'undefined') window.scrollTo(0, 0);
    document.title = (v.titles[v.screen] ? v.titles[v.screen] + ' · ' : '') + 'מכון פוירשטיין · מערכת הלמידה';
  }

  /* ---------------------------------------------------------------- events */

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    if (el.tagName === 'FORM') return;
    var act = el.getAttribute('data-act');
    var fn = actions[act];
    if (!fn) return;
    e.preventDefault();
    fn(el.getAttribute('data-arg'));
  });

  document.addEventListener('submit', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act="ask"]') : null;
    if (!el) return;
    e.preventDefault();
    var input = el.querySelector('input');
    if (input && input.value.trim()) {
      toast('השאלה נשלחה למרצה');
      input.value = '';
    }
  });

  /* Inputs write straight to state without re-rendering, so typing is never
     interrupted and nothing is lost to a refresh. */
  function captureField(e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    var bound = el.getAttribute('data-bind');
    if (bound) { state[bound] = el.value; save(); return; }

    var path = el.getAttribute('data-cur');
    if (path) {
      // Written without a re-render, so an edit never interrupts typing.
      var c = editableCurriculum();
      var parts = path.split('.');
      var node = c;
      for (var i = 0; i < parts.length - 1; i++) node = node[parts[i]];
      var last = parts[parts.length - 1];
      node[last] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
      save();
      return;
    }

    var key = el.getAttribute('data-field');
    if (!key) return;
    state.forms[key] = el.type === 'checkbox' ? el.checked : el.value;
    save();
  }
  document.addEventListener('input', captureField);
  document.addEventListener('change', captureField);

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (state.preview !== 'auto') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { render(); }, 150);
  });

  /* ------------------------------------------------------------------ boot

     auth.js gates the page and calls boot() once someone is signed in. When
     this file is opened on its own, with no gate present, it still starts —
     so the app stays usable as a standalone file. */

  window.FeuersteinLearn = {
    boot: function (user, api) {
      currentUser = user || null;
      authApi = api || null;
      if (currentUser && currentUser.name && !(state.name || '').trim()) {
        // Someone who signed in with a real account has already identified
        // themselves; carry the name in and skip the demo registration form.
        state.name = currentUser.name;
        if (state.screen === 'register') { state.registered = true; state.screen = 'home'; }
        save();
      }
      render();
    }
  };

  if (!window.FP_GATED) render();
})();
</script>
<script>/* ==========================================================================
   Sign-in gate for the learning system.

   Authentication is the institute's own Microsoft 365 (Microsoft Entra ID)
   account — the same identity people already use for Teams, Outlook and
   SharePoint. No second password to manage.

   Configuration lives in ms-config.js next to this page, so IT can set the
   app registration values without rebuilding anything. Until those values
   are filled in, the gate says so plainly and offers a clearly-labelled
   demo entry so the system can still be shown.
   ========================================================================== */

(function () {
  'use strict';

  var CFG = window.MS_AUTH_CONFIG || {};
  var SESSION_KEY = 'feuerstein-learn-session';
  var configured = !!(CFG.clientId && CFG.tenantId);

  /* ------------------------------------------------------------------ logo */

  function logoMarkup(size) {
    return '' +
      '<div class="fp-logo" style="--logo-size:' + size + 'px">' +
      '<img src="logo.svg" alt="מכון פוירשטיין"' +
      ' onerror="this.onerror=null;this.src=\'logo.png\';this.addEventListener(\'error\',function(){' +
      'this.style.display=\'none\';this.parentNode.querySelector(\'.fp-logo-fallback\').hidden=false;},{once:true})">' +
      '<div class="fp-logo-fallback" hidden>' +
      '<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke-width="14">' +
      '<path d="M50 7a43 43 0 0 0-43 43" stroke="#E5B31C"/>' +
      '<path d="M50 7a43 43 0 0 1 43 43" stroke="#2B4C9B"/>' +
      '<path d="M7 50a43 43 0 0 0 43 43" stroke="#4E8B2C"/>' +
      '<path d="M93 50a43 43 0 0 1-43 43" stroke="#E03127"/>' +
      '</g></svg>' +
      '</div>' +
      '<div class="fp-wordmark">מכון פוירשטיין</div></div>';
  }

  /* --------------------------------------------------------------- session */

  function readSession() {
    try {
      var raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeSession(user) {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) { /* ignore */ }
  }

  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
  }

  /* ------------------------------------------------------------------ MSAL */

  var msalApp = null;

  function msalConfig() {
    return {
      auth: {
        clientId: CFG.clientId,
        authority: 'https://login.microsoftonline.com/' + CFG.tenantId,
        redirectUri: CFG.redirectUri || (location.origin + location.pathname),
        navigateToLoginRequestUrl: true
      },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
    };
  }

  function accountToUser(acct) {
    return {
      name: acct.name || (acct.username || '').split('@')[0],
      email: acct.username || '',
      id: acct.homeAccountId || '',
      via: 'microsoft'
    };
  }

  async function initMsal() {
    if (!configured || !window.msal) return null;
    if (!msalApp) {
      msalApp = new window.msal.PublicClientApplication(msalConfig());
      await msalApp.initialize();
    }
    return msalApp;
  }

  /* -------------------------------------------------------------- gate UI */

  function gate(opts) {
    opts = opts || {};
    var root = document.getElementById('root');

    var body;
    if (opts.busy) {
      body = '<div class="fp-gate-busy"><span class="fp-spinner" aria-hidden="true"></span>' +
        '<span>' + (opts.busy === true ? 'מתחבר…' : opts.busy) + '</span></div>';
    } else if (configured) {
      body =
        '<button type="button" class="fp-ms-btn" id="fp-ms-signin">' +
        '<span class="fp-ms-logo" aria-hidden="true">' +
        '<i style="background:#f25022"></i><i style="background:#7fba00"></i>' +
        '<i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>' +
        '<span>התחברות עם חשבון המכון</span></button>' +
        '<p class="fp-gate-note">אותו חשבון Microsoft 365 שבו את/ה משתמש/ת ב-Teams ובמייל. ' +
        'הכניסה מתבצעת מול השרתים של Microsoft — המערכת לא רואה את הסיסמה.</p>';
    } else {
      body =
        '<div class="fp-gate-warn">' +
        '<strong>ההתחברות ל-Microsoft עדיין לא הוגדרה.</strong>' +
        'צריך רישום אפליקציה ב-Microsoft Entra ID של המכון, ואז למלא את המזהים בקובץ ' +
        '<code>ms-config.js</code>. ההוראות המלאות נמצאות ב-<code>learn-src/README.md</code>.' +
        '</div>' +
        '<button type="button" class="fp-demo-btn" id="fp-demo-enter">כניסה לדמו · ללא התחברות</button>' +
        '<p class="fp-gate-note">מצב הדגמה: הנתונים מקומיים בדפדפן הזה בלבד.</p>';
    }

    root.innerHTML =
      '<div class="fp-gate">' +
      '<div class="fp-gate-bg" aria-hidden="true"></div>' +
      '<div class="fp-gate-inner">' +
      logoMarkup(84) +
      '<div class="fp-gate-head">' +
      '<h1>מערכת הלמידה</h1>' +
      '<p>מסלול ההכשרה, התיק האישי, שיעורי ההעשרה ומאגר הידע של מכון פוירשטיין.</p>' +
      '</div>' +
      '<div class="fp-gate-card">' + body +
      (opts.error ? '<p class="fp-gate-error">' + opts.error + '</p>' : '') +
      '</div>' +
      '<a class="fp-gate-back" href="./">חזרה לבחירת מערכת</a>' +
      '</div></div>';

    var signin = document.getElementById('fp-ms-signin');
    if (signin) signin.addEventListener('click', signIn);
    var demo = document.getElementById('fp-demo-enter');
    if (demo) demo.addEventListener('click', function () {
      var user = { name: '', email: '', id: 'demo', via: 'demo' };
      writeSession(user);
      enter(user);
    });
  }

  /* --------------------------------------------------------------- actions */

  async function signIn() {
    gate({ busy: true });
    try {
      var app = await initMsal();
      if (!app) throw new Error('ספריית ההתחברות לא נטענה');
      await app.loginRedirect({ scopes: ['User.Read'], prompt: 'select_account' });
    } catch (e) {
      gate({ error: 'ההתחברות נכשלה: ' + (e && e.message ? e.message : 'שגיאה לא ידועה') });
    }
  }

  async function signOut() {
    var session = readSession();
    clearSession();
    if (session && session.via === 'microsoft' && configured) {
      try {
        var app = await initMsal();
        var acct = app.getAllAccounts()[0];
        await app.logoutRedirect({ account: acct, postLogoutRedirectUri: location.origin + location.pathname });
        return;
      } catch (e) { /* fall through to a local sign-out */ }
    }
    location.reload();
  }

  function enter(user) {
    if (window.FeuersteinLearn && window.FeuersteinLearn.boot) {
      window.FeuersteinLearn.boot(user, { signOut: signOut });
    }
  }

  /* ----------------------------------------------------------------- boot */

  async function start() {
    // A redirect coming back from Microsoft has to be handled before anything else.
    if (configured && window.msal) {
      gate({ busy: true });
      try {
        var app = await initMsal();
        var result = await app.handleRedirectPromise();
        if (result && result.account) {
          app.setActiveAccount(result.account);
          var user = accountToUser(result.account);
          writeSession(user);
          return enter(user);
        }
        var existing = app.getAllAccounts();
        if (existing.length) {
          app.setActiveAccount(existing[0]);
          var known = accountToUser(existing[0]);
          writeSession(known);
          return enter(known);
        }
      } catch (e) {
        return gate({ error: 'ההתחברות נכשלה: ' + (e && e.message ? e.message : 'שגיאה לא ידועה') });
      }
      return gate();
    }

    // Not configured: a previous demo session still counts as signed in.
    var saved = readSession();
    if (saved) return enter(saved);
    gate();
  }

  window.FeuersteinAuth = { signOut: signOut, gate: gate, configured: configured };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
