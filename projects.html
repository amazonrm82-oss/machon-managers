<style>

    --color-accent-900: #FFF3E9;
    --color-neutral-500: #A99783;
    --color-neutral-700: #DED2C2;
    --color-neutral-800: #F2EAD9;

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--color-neutral-700); background: var(--color-surface); color: var(--color-text); font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }

  .card { background: var(--color-surface); border: 1px solid var(--color-neutral-700); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--space-4); }

  .tag-done { background: #E3F3E9; color: #256B41; }

  .breadcrumb { font-size: 13px; opacity: .65; margin-bottom: var(--space-3); }

  h1 { font-size: 22px; margin: 0 0 var(--space-2); }
  h2 { font-size: 17px; margin: 0; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
  .task-row { display: flex; align-items: center; gap: var(--space-3); padding: 8px 0; border-bottom: 1px solid var(--color-neutral-800); }
  .task-row:last-child { border-bottom: none; }
  .error-box { background: var(--color-accent-900); color: var(--color-accent-700); border: 1px solid var(--color-accent-800); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; }
  .loading-box { text-align: center; padding: 60px 0; opacity: .6; }
  .overdue { color: var(--color-accent-700); font-weight: 600; }
  .progress-track { background: var(--color-neutral-800); border-radius: 99px; height: 6px; overflow: hidden; }
  .progress-fill { background: var(--color-accent); height: 100%; border-radius: 99px; transition: width .15s ease; }
  .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-3); flex-wrap: wrap; }

  .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; flex-shrink: 0; line-height: 1; }

  .avatar-stack .avatar:first-child { margin-inline-start: 0; }

  .board-wrap { display: flex; gap: var(--space-4); overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .board-col { flex: 0 0 270px; background: var(--color-neutral-800); border-radius: var(--radius-md); padding: var(--space-3); min-height: 80px; }
  .board-col.drag-over { outline: 2px dashed var(--color-accent); outline-offset: -2px; }
  .board-col-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
  .board-col-title { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .board-col-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .board-col-count { font-size: 12px; opacity: .55; background: var(--color-surface); border-radius: 99px; padding: 1px 8px; }
  .board-card { background: var(--color-surface); border: 1px solid var(--color-neutral-700); border-inline-start: 3px solid var(--color-neutral-500); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow-sm, 0 1px 2px rgba(43,32,21,.06)); transition: box-shadow .12s ease, transform .12s ease; }
  .board-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .board-card.dragging { opacity: .4; }
  .board-card.prio-border-high { border-inline-start-color: var(--color-accent-700); }
  .board-card.prio-border-medium { border-inline-start-color: var(--color-neutral-500); }
  .board-card.prio-border-low { border-inline-start-color: #4E9187; }
  .board-card-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .board-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; }
  .board-empty { text-align: center; padding: 20px 8px; opacity: .4; font-size: 12px; }

  .timeline-wrap { overflow-x: auto; }
  .timeline-scale { position: relative; height: 24px; margin-inline-start: 200px; border-bottom: 1px solid var(--color-neutral-700); min-width: 700px; }
  .timeline-scale-tick { position: absolute; top: 0; bottom: 0; font-size: 11px; opacity: .55; border-inline-start: 1px solid var(--color-neutral-800); padding-inline-start: 4px; }
  .timeline-row { display: flex; align-items: center; min-height: 40px; border-bottom: 1px solid var(--color-neutral-800); }
  .timeline-row-label { width: 200px; flex-shrink: 0; font-size: 12px; padding-inline-end: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .timeline-row-label:hover { text-decoration: underline; }
  .timeline-track { position: relative; flex: 1; height: 24px; min-width: 700px; }
  .timeline-bar { position: absolute; top: 3px; height: 18px; border-radius: 99px; cursor: pointer; display: flex; align-items: center; padding: 0 8px; font-size: 10px; color: #fff; white-space: nowrap; overflow: hidden; }
  .timeline-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--color-accent); opacity: .5; }
  .no-dates-note { font-size: 12px; opacity: .55; margin-top: var(--space-3); }

  .task-checklist { padding: 6px 0 6px 34px; }
  .checklist-item { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
  .checklist-item button { border: none; background: none; cursor: pointer; opacity: .4; font-size: 11px; }
  .checklist-item button:hover { opacity: 1; }
  .checklist-add { display: flex; gap: 6px; margin-top: 4px; }
  .checklist-add input { flex: 1; padding: 4px 8px; font-size: 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-neutral-700); font-family: inherit; }
  .checklist-toggle { border: none; background: var(--color-neutral-800); border-radius: 99px; font-size: 10px; padding: 2px 8px; cursor: pointer; color: var(--color-text); white-space: nowrap; }

  .mytasks-row { display: flex; align-items: center; gap: var(--space-3); padding: 10px 0; border-bottom: 1px solid var(--color-neutral-800); }
  .mytasks-row:last-child { border-bottom: none; }
  .whoami-card { max-width: 420px; }
</style>

<body>
<div id="root"></div>
<script>
'use strict';
const SUPABASE_URL = 'https://tnfjcmmblrkhypprjacq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZmpjbW1ibHJraHlwcHJqYWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTE5ODMsImV4cCI6MjEwMzIyNzk4M30.SWp32bN-Pm-X4qDX8QbGQED5DYJBZQBg28C4vJ17gns';
const SUPABASE_STATE_URL = SUPABASE_URL + '/rest/v1/app_state';
const PROJECTS_URL = SUPABASE_URL + '/rest/v1/projects';
const TASKS_URL = SUPABASE_URL + '/rest/v1/project_tasks';
const UPDATES_URL = SUPABASE_URL + '/rest/v1/project_updates';
const DOCS_URL = SUPABASE_URL + '/rest/v1/project_documents';
const SEND_NOTIFICATION_URL = SUPABASE_URL + '/functions/v1/send-notification';
const HEADERS_JSON = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
const HEADERS_GET = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
const PROJECTS_SELECT = '*,project_tasks(id,status)';
const POLL_MS = 20000;
const MAX_DOC_BYTES = 3 * 1024 * 1024;

const STATUS_OPTIONS = ['מתוכנן', 'בביצוע', 'הושלם', 'תקוע'];
const STATUS_TAG_CLASS = { 'מתוכנן': 'tag-planned', 'בביצוע': 'tag-progress', 'הושלם': 'tag-done', 'תקוע': 'tag-stuck' };
const PRIORITY_OPTIONS = ['גבוהה', 'בינונית', 'נמוכה'];
const PRIORITY_TAG_CLASS = { 'גבוהה': 'prio-high', 'בינונית': 'prio-medium', 'נמוכה': 'prio-low' };
const CATEGORY_OPTIONS = ['תשתיות ובינוי', 'רכש והצטיידות', 'הדרכה וכוח אדם', 'תוכניות וטיפול', 'IT ומערכות', 'אחר'];
const TASK_STATUS_OPTIONS = ['ממתין', 'בביצוע', 'הושלם'];
const ROLE_LABELS = { national: 'מנהל תפעול ארצי', president: 'נשיא', instituteManager: 'מנהל/ת מכון' };
// A pseudo-institute for organization-wide projects that aren't tied to any single institute
// (e.g. a headquarters initiative). Only national/president ever see or use it — institute
// managers never leave their own institute's scope, so they never encounter this id.
const DIVISION_ID = '__general__';
const DIVISION_NAME = 'כללי';

function notifyIdentity(identityKeys, title, body) {
  try {
    fetch(SEND_NOTIFICATION_URL, { method: 'POST', headers: HEADERS_JSON, body: JSON.stringify({ identityKeys, title, body: body || '', url: './projects.html' }) }).catch(() => {});
  } catch (e) { /* best-effort — a failed push must never block saving the project itself */ }
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function isOverdue(p) { return !!(p.target_date && p.status !== 'הושלם' && p.target_date < todayStr()); }
function taskProgress(p) {
  const tasks = p.project_tasks || [];
  const done = tasks.filter((t) => t.status === 'הושלם').length;
  return { done, total: tasks.length };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtILS(n) { const v = Math.round(Number(n) || 0); return v.toLocaleString('he-IL') + ' ₪'; }
function roleKey(role, instituteId) { return role === 'instituteManager' ? 'institute_' + instituteId : role; }
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const AVATAR_COLORS = ['#C2410C', '#0F766E', '#7C3AED', '#B8480D', '#0369A1', '#A16207', '#BE185D', '#15803D'];
function nameInitials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function nameColor(name) {
  let h = 0;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function avatarHtml(name, size) {
  const cls = size === 'sm' ? 'avatar-sm' : 'avatar-md';
  return `<span class="avatar ${cls}" style="background:${nameColor(name)};" title="${esc(name)}">${esc(nameInitials(name))}</span>`;
}
function avatarStackHtml(names, size) {
  if (!names || !names.length) return '';
  return `<span class="avatar-stack">${names.map((n) => avatarHtml(n, size)).join('')}</span>`;
}
function instituteEmployees(instituteId) {
  // "כללי" projects aren't tied to one institute's staff, so suggest everyone across every
  // institute instead of an empty list — still just a suggestion, free text stays allowed.
  if (instituteId === DIVISION_ID) {
    const all = new Set();
    Object.values(state.employeesByInstitute || {}).forEach((list) => list.forEach((n) => all.add(n)));
    return [...all].sort();
  }
  return (state.employeesByInstitute && state.employeesByInstitute[instituteId]) || [];
}

const SESSION_KEY = 'fp_projects_session_v1';
let state = {
  screen: 'loading', // loading | login | app
  role: sessionStorage.getItem(SESSION_KEY + '_role') || '',
  myInstituteId: sessionStorage.getItem(SESSION_KEY + '_inst') || '',
  loginRolePick: 'instituteManager',
  loginInstitutePick: '',
  loginPassword: '',
  loginError: '',
  allInstitutes: [], // [{id, name}]
  employeesByInstitute: {}, // instituteId -> [names]
  rolePasswords: null,
  projectListViewMode: 'board', // board | list | timeline
  newTeamMemberPick: '',
  dragProjectId: null,
  expandedChecklists: {}, // taskId -> bool
  checklistDraft: {}, // taskId -> draft text
  myName: sessionStorage.getItem(SESSION_KEY + '_myname') || '',
  myNamePick: '',
  myTasks: [],
  myTasksLoading: false,
  myTasksFrom: null,
  view: 'instituteList', // instituteList | projectList | projectDetail | overview
  currentInstituteId: null,
  projects: [],
  projectCounts: {},
  currentProject: null,
  isNewProject: false,
  projectForm: null,
  currentTasks: [],
  taskDraft: { title: '', assignee: '', dueDate: '' },
  currentUpdates: [],
  updateDraft: '',
  currentDocuments: [],
  docUploadError: '',
  docUploading: false,
  busy: false,
  saving: false,
  fatalError: '',
  projectListStatusFilter: 'all',
  projectListOverdueOnly: false,
  projectListHideDone: false,
  projectListSearch: '',
  overviewProjects: [],
  overviewLoading: false,
  overviewSearch: '',
  overviewFrom: null, // where to return to when leaving the overview screen
};

let pollTimer = null;
function startPolling() { if (!pollTimer) pollTimer = setInterval(pollTick, POLL_MS); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
async function pollTick() {
  if (state.screen !== 'app') return;
  if (state.view === 'projectList' && state.currentInstituteId) {
    try {
      const res = await fetch(PROJECTS_URL + '?institute_id=eq.' + encodeURIComponent(state.currentInstituteId) + '&select=' + encodeURIComponent(PROJECTS_SELECT) + '&order=created_at.desc', { headers: HEADERS_GET });
      if (res.ok) { state.projects = await res.json(); render(); }
    } catch (e) { /* silent — next tick retries */ }
  } else if (state.view === 'projectDetail' && !state.isNewProject && state.currentProject) {
    // only refresh the task list, not the whole page — a full re-render would blow away
    // whatever the user is mid-typing in the project's own name/description/etc. fields
    try {
      const res = await fetch(TASKS_URL + '?project_id=eq.' + encodeURIComponent(state.currentProject.id) + '&order=created_at.asc', { headers: HEADERS_GET });
      if (res.ok) {
        state.currentTasks = await res.json();
        const container = document.getElementById('taskListContainer');
        if (container) container.innerHTML = taskListHtml();
      }
    } catch (e) { /* silent — next tick retries */ }
  }
}

function render() {
  const root = document.getElementById('root');
  if (state.screen === 'loading') { root.innerHTML = '<div class="loading-box">טוען…</div>'; return; }
  if (state.fatalError) { root.innerHTML = '<div class="wrap"><div class="error-box">' + esc(state.fatalError) + '</div></div>'; return; }
  if (state.screen === 'login') { root.innerHTML = loginTemplate(); return; }
  root.innerHTML = topbarTemplate() + '<div class="wrap">' + appBodyTemplate() + '</div>';
}

function loginTemplate() {
  const instOptions = state.allInstitutes.map((i) => `<option value="${esc(i.id)}"${state.loginInstitutePick === i.id ? ' selected' : ''}>${esc(i.name)}</option>`).join('');
  return `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;">
    <div class="card" style="max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;">
      <div>
        <div style="font-weight:700;font-size:18px;">ניהול פרויקטים</div>
        <div class="muted">מכון פוירשטיין — גישה למנהל תפעול ארצי, נשיא ומנהלי מכונים בלבד</div>
      </div>
      <div class="field"><label>תפקיד</label>
        <select class="input" id="loginRole" onchange="onLoginRoleChange(this.value)">

function onCardDragStart(ev, projectId) {
  state.dragProjectId = projectId;
  ev.dataTransfer.effectAllowed = 'move';
  ev.currentTarget.classList.add('dragging');
}
function onCardDragEnd(ev) { ev.currentTarget.classList.remove('dragging'); state.dragProjectId = null; }
function onColDragOver(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
function onColDragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }
function onColDrop(ev, newStatus) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const projectId = state.dragProjectId;
  state.dragProjectId = null;
  if (!projectId) return;
  moveProjectToStatus(projectId, newStatus);
}

async function moveProjectToStatus(projectId, newStatus) {
  const p = state.projects.find((x) => x.id === projectId);
  if (!p || p.status === newStatus) return;
  const prevStatus = p.status;
  p.status = newStatus;
  render();
  try {
    const res = await fetch(PROJECTS_URL + '?id=eq.' + encodeURIComponent(projectId), { method: 'PATCH', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify({ status: newStatus, updated_at: new Date().toISOString() }) });
    if (!res.ok) throw new Error('status update failed');
    if (newStatus === 'תקוע' && prevStatus !== 'תקוע') {
      notifyIdentity(['national', 'president'], 'פרויקט תקוע', `${p.name} — ${p.institute_name || instituteName(p.institute_id)}`);
    }
  } catch (e) {
    p.status = prevStatus;
    render();
    alert('עדכון הסטטוס נכשל — נסה/י שוב');
  }
}

const STATUS_BAR_COLOR = { 'מתוכנן': '#A99783', 'בביצוע': 'var(--color-accent-500)', 'תקוע': 'var(--color-accent-700)', 'הושלם': '#256B41' };
function timelineHtml(filtered) {
  const withDates = filtered.filter((p) => p.start_date && p.target_date);
  const withoutDates = filtered.filter((p) => !(p.start_date && p.target_date));
  if (!withDates.length) {
    return `<div class="muted">אין פרויקטים עם תאריך התחלה ויעד להצגה על ציר הזמן.${withoutDates.length ? ' (' + withoutDates.length + ' פרויקטים ללא תאריכים מלאים)' : ''}</div>`;
  }
  let minMs = Infinity, maxMs = -Infinity;
  withDates.forEach((p) => {
    const s = new Date(p.start_date).getTime();
    const e = new Date(p.target_date).getTime();
    if (s < minMs) minMs = s;
    if (e > maxMs) maxMs = e;
  });
  const padMs = 3 * 24 * 60 * 60 * 1000;
  minMs -= padMs; maxMs += padMs;
  const spanMs = Math.max(1, maxMs - minMs);
  const pct = (ms) => ((ms - minMs) / spanMs) * 100;

  // month tick marks across the span
  const ticks = [];
  const cursor = new Date(minMs);
  cursor.setDate(1);
  const MONTH_NAMES = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];
  while (cursor.getTime() < maxMs) {
    const ms = cursor.getTime();
    if (ms >= minMs) ticks.push({ pct: pct(ms), label: MONTH_NAMES[cursor.getMonth()] + ' ' + cursor.getFullYear() });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  const todayPct = pct(Date.now());
  const todayMarker = (todayPct >= 0 && todayPct <= 100) ? `<div class="timeline-today" style="right:${todayPct}%;"></div>` : '';

  const rows = withDates.map((p) => {
    const left = pct(new Date(p.start_date).getTime());
    const width = Math.max(1.5, pct(new Date(p.target_date).getTime()) - left);
    return `
    <div class="timeline-row">
      <div class="timeline-row-label" onclick="openProjectDetail('${esc(p.id)}')" title="${esc(p.name)}">${esc(p.name)}</div>
      <div class="timeline-track">
        <div class="timeline-bar" style="right:${left}%;width:${width}%;background:${STATUS_BAR_COLOR[p.status] || '#A99783'};" onclick="openProjectDetail('${esc(p.id)}')" title="${esc(p.name)}: ${esc(p.start_date)} — ${esc(p.target_date)}">${esc(p.name)}</div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="timeline-wrap">
      <div class="timeline-scale">${ticks.map((t) => `<div class="timeline-scale-tick" style="right:${t.pct}%;">${esc(t.label)}</div>`).join('')}</div>
      <div style="position:relative;">
        ${todayMarker}
        ${rows}
      </div>
    </div>
    ${withoutDates.length ? `<div class="no-dates-note">${withoutDates.length} פרויקטים בלי תאריך התחלה+יעד מלאים אינם מוצגים על הציר.</div>` : ''}`;
}

function onLoginRoleChange(val) { state.loginRolePick = val; render(); }

async function submitLogin() {
  const passInput = document.getElementById('loginPassword');
  state.loginPassword = passInput ? passInput.value : state.loginPassword;
  const role = state.loginRolePick;
  const instituteId = state.loginInstitutePick;
  if (role === 'instituteManager' && !instituteId) { state.loginError = 'יש לבחור מכון'; render(); return; }
  const expected = state.rolePasswords ? state.rolePasswords[roleKey(role, instituteId)] : null;
  if (!expected || (state.loginPassword || '').trim() !== String(expected).trim()) {
    state.loginError = 'סיסמה שגויה';
    render();
    return;
  }
  state.role = role;
  state.myInstituteId = role === 'instituteManager' ? instituteId : '';
  sessionStorage.setItem(SESSION_KEY + '_role', state.role);
  sessionStorage.setItem(SESSION_KEY + '_inst', state.myInstituteId);
  state.loginError = '';
  state.loginPassword = '';
  await enterApp();
}

function logout() {
  stopPolling();
  sessionStorage.removeItem(SESSION_KEY + '_role');
  sessionStorage.removeItem(SESSION_KEY + '_inst');
  state.role = '';
  state.myInstituteId = '';
  state.screen = 'login';
  render();
}

async function fetchAppStateBasics() {
  const res = await fetch(SUPABASE_STATE_URL + '?id=eq.1&select=data', { headers: HEADERS_GET });
  if (!res.ok) throw new Error('state fetch failed');
  const rows = await res.json();
  const data = (rows && rows[0] && rows[0].data) || {};
  state.rolePasswords = data.rolePasswords || {};
  state.allInstitutes = Array.isArray(data.institutes) ? data.institutes.map((i) => ({ id: i.id, name: i.name })) : [];
  const byInst = {};
  (Array.isArray(data.institutes) ? data.institutes : []).forEach((i) => {
    byInst[i.id] = Array.isArray(i.employees) ? i.employees.map((e) => e.name).filter(Boolean) : [];
  });
  state.employeesByInstitute = byInst;
}

async function fetchProjectCounts() {
  try {
    const res = await fetch(PROJECTS_URL + '?select=institute_id', { headers: HEADERS_GET });
    if (!res.ok) return;
    const rows = await res.json();
    const counts = {};
    rows.forEach((r) => { counts[r.institute_id] = (counts[r.institute_id] || 0) + 1; });
    state.projectCounts = counts;
  } catch (e) { /* non-fatal — counts just stay at 0 */ }
}

async function openProjectDetail(id) {
  const p = state.projects.find((x) => x.id === id) || state.overviewProjects.find((x) => x.id === id);
  if (!p) return;
  state.isNewProject = false;
  state.currentProject = p;
  state.projectForm = {
    name: p.name || '', description: p.description || '', status: p.status || 'מתוכנן',
    priority: p.priority || 'בינונית', category: p.category || '',
    start_date: p.start_date || '', target_date: p.target_date || '', owner: p.owner || '', budget: p.budget || '',
    team: Array.isArray(p.team) ? [...p.team] : [],
  };
  state.currentInstituteId = p.institute_id;
  state.view = 'projectDetail';
  state.docUploadError = '';
  render();
  try {
    const [tasksRes, updatesRes, docsRes] = await Promise.all([
      fetch(TASKS_URL + '?project_id=eq.' + encodeURIComponent(id) + '&order=created_at.asc', { headers: HEADERS_GET }),
      fetch(UPDATES_URL + '?project_id=eq.' + encodeURIComponent(id) + '&order=created_at.desc', { headers: HEADERS_GET }),
      fetch(DOCS_URL + '?project_id=eq.' + encodeURIComponent(id) + '&order=created_at.desc', { headers: HEADERS_GET }),
    ]);
    state.currentTasks = tasksRes.ok ? await tasksRes.json() : [];
    state.currentUpdates = updatesRes.ok ? await updatesRes.json() : [];
    state.currentDocuments = docsRes.ok ? await docsRes.json() : [];
  } catch (e) { state.currentTasks = []; state.currentUpdates = []; state.currentDocuments = []; }
  render();
}

async function saveProject() {
  const f = state.projectForm;
  if (!f.name.trim()) { alert('יש להזין שם לפרויקט'); return; }
  if (f.start_date && f.target_date && f.target_date < f.start_date) {
    if (!confirm('תאריך היעד מוקדם מתאריך ההתחלה — לשמור בכל זאת?')) return;
  }
  const wasNew = state.isNewProject;
  const prevStatus = state.currentProject ? state.currentProject.status : null;
  const payload = {
    institute_id: state.currentInstituteId,
    institute_name: instituteName(state.currentInstituteId),
    name: f.name.trim(), description: f.description.trim(), status: f.status,
    priority: f.priority || 'בינונית', category: f.category || null,
    start_date: f.start_date || null, target_date: f.target_date || null,
    owner: f.owner.trim(), budget: f.budget === '' ? null : Math.max(0, Number(f.budget) || 0),
    team: f.team || [],
    updated_at: new Date().toISOString(),
  };
  state.saving = true; render();
  try {
    if (wasNew) {
      payload.id = uid('proj_');
      payload.created_at = new Date().toISOString();
      const res = await fetch(PROJECTS_URL, { method: 'POST', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error('create failed');
    } else {
      const res = await fetch(PROJECTS_URL + '?id=eq.' + encodeURIComponent(state.currentProject.id), { method: 'PATCH', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error('update failed');
    }
  } catch (e) {
    state.saving = false; render();
    alert('שמירה נכשלה — בדוק/י חיבור לאינטרנט ונסה/י שוב');
    return;
  }
  state.saving = false;
  // Notify whoever should act next — same identity-key targeting the main app's own push
  // notifications use, so this reaches exactly the right people without a separate system.
  if (wasNew) {
    if (state.role === 'instituteManager') {
      notifyIdentity(['national', 'president'], 'פרויקט חדש נוצר', `${payload.name} — ${payload.institute_name}`);
    } else {
      notifyIdentity(['instituteManager::' + payload.institute_id], 'נוצר פרויקט חדש במכון שלך', payload.name);
    }
  } else if (payload.status === 'תקוע' && prevStatus !== 'תקוע') {
    notifyIdentity(['national', 'president'], 'פרויקט תקוע', `${payload.name} — ${payload.institute_name}`);
  }
  await openInstituteProjects(state.currentInstituteId);
}

async function deleteProject() {
  if (!state.currentProject) return;
  if (!confirm('למחוק את הפרויקט "' + state.currentProject.name + '"? הפעולה בלתי הפיכה, כולל כל המשימות שבו.')) return;
  state.saving = true; render();
  try {
    await fetch(TASKS_URL + '?project_id=eq.' + encodeURIComponent(state.currentProject.id), { method: 'DELETE', headers: HEADERS_JSON });

  } catch (e) {
    state.saving = false; render();
    alert('המחיקה נכשלה — נסה/י שוב');
    return;
  }

  await openInstituteProjects(state.currentInstituteId);
}

async function addTask() {
  const title = (state.taskDraft.title || '').trim();
  if (!title || !state.currentProject) return;
  const row = { id: uid('task_'), project_id: state.currentProject.id, title, assignee: (state.taskDraft.assignee || '').trim(), due_date: state.taskDraft.dueDate || null, status: 'ממתין', created_at: new Date().toISOString() };
  try {
    const res = await fetch(TASKS_URL, { method: 'POST', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify(row) });
    if (!res.ok) throw new Error('add task failed');
  } catch (e) { alert('הוספת המשימה נכשלה'); return; }
  state.taskDraft = { title: '', assignee: '', dueDate: '' };
  await openProjectDetail(state.currentProject.id);
}

  const t = state.currentTasks.find((x) => x.id === taskId);

  render();
}
function toggleTaskDone(taskId, checked) { setTaskStatus(taskId, checked ? 'הושלם' : 'ממתין'); }

async function removeTask(taskId) {
  try { await fetch(TASKS_URL + '?id=eq.' + encodeURIComponent(taskId), { method: 'DELETE', headers: HEADERS_JSON }); } catch (e) {}
  state.currentTasks = state.currentTasks.filter((t) => t.id !== taskId);
  render();
}

function toggleChecklistExpanded(taskId) {

  render();
}

async function saveChecklist(taskId, checklist) {
  const t = state.currentTasks.find((x) => x.id === taskId);
  if (t) t.checklist = checklist;
  const container = document.getElementById('taskListContainer');
  if (container) container.innerHTML = taskListHtml();
  try { await fetch(TASKS_URL + '?id=eq.' + encodeURIComponent(taskId), { method: 'PATCH', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify({ checklist }) }); } catch (e) {}
}

function addChecklistItem(taskId) {
  const text = (state.checklistDraft[taskId] || '').trim();
  if (!text) return;
  const t = state.currentTasks.find((x) => x.id === taskId);
  const items = (t && Array.isArray(t.checklist)) ? t.checklist : [];
  const next = [...items, { id: uid('ci_'), text, done: false }];
  state.checklistDraft[taskId] = '';
  state.expandedChecklists[taskId] = true;
  saveChecklist(taskId, next);
}

function toggleChecklistItem(taskId, itemId, done) {
  const t = state.currentTasks.find((x) => x.id === taskId);
  const items = (t && Array.isArray(t.checklist)) ? t.checklist : [];
  saveChecklist(taskId, items.map((it) => (it.id === itemId ? { ...it, done } : it)));
}

function removeChecklistItem(taskId, itemId) {
  const t = state.currentTasks.find((x) => x.id === taskId);
  const items = (t && Array.isArray(t.checklist)) ? t.checklist : [];
  saveChecklist(taskId, items.filter((it) => it.id !== itemId));
}

async function addUpdate() {
  const text = (state.updateDraft || '').trim();
  if (!text || !state.currentProject) return;

  state.currentUpdates = [row, ...state.currentUpdates];
  state.updateDraft = '';
  const container = document.getElementById('updatesListContainer');
  if (container) container.innerHTML = updatesListHtml();

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function uploadDocument(file) {
  if (!file || !state.currentProject) return;
  state.docUploadError = '';
  if (file.size > MAX_DOC_BYTES) {
    state.docUploadError = `הקובץ גדול מדי (${Math.round(file.size / 1024 / 1024 * 10) / 10}MB) — המגבלה היא 3MB.`;
    render();
    return;
  }
  state.docUploading = true; render();
  try {
    const dataUrl = await readFileAsDataUrl(file);
    const row = { id: uid('doc_'), project_id: state.currentProject.id, file_name: file.name, file_type: file.type || '', data_url: dataUrl, created_at: new Date().toISOString() };
    const res = await fetch(DOCS_URL, { method: 'POST', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify(row) });
    if (!res.ok) throw new Error('upload failed');
    state.currentDocuments = [row, ...state.currentDocuments];
  } catch (e) {
    state.docUploadError = 'העלאת הקובץ נכשלה — נסה/י שוב.';
  }
  state.docUploading = false;
  const fileInput = document.getElementById('docFileInput');
  if (fileInput) fileInput.value = '';
  render();
}

async function removeDocument(docId) {
  if (!confirm('להסיר את המסמך?')) return;
  try { await fetch(DOCS_URL + '?id=eq.' + encodeURIComponent(docId), { method: 'DELETE', headers: HEADERS_JSON }); } catch (e) {}
  state.currentDocuments = state.currentDocuments.filter((d) => d.id !== docId);
  render();

  const q = (state.overviewSearch || '').trim().toLowerCase();
  if (!q) return state.overviewProjects;
  return state.overviewProjects.filter((p) => (p.name || '').toLowerCase().includes(q) || (p.institute_name || '').toLowerCase().includes(q) || (p.owner || '').toLowerCase().includes(q));
}

function overviewTemplate() {
  if (state.overviewLoading) return '<div class="loading-box">טוען סקירה…</div>';
  const all = state.overviewProjects;
  const byStatus = {};
  STATUS_OPTIONS.forEach((s) => { byStatus[s] = 0; });
  let totalBudget = 0;
  let overdueCount = 0;
  all.forEach((p) => {
    byStatus[p.status] = (byStatus[p.status] || 0) + 1;
    totalBudget += Number(p.budget) || 0;
    if (isOverdue(p)) overdueCount += 1;
  });
  const filtered = overviewVisibleProjects();
  const rows = filtered.map((p) => {
    const prog = taskProgress(p);
    const overdue = isOverdue(p);
    return `
    <tr class="clickable-row" onclick="openProjectDetail('${esc(p.id)}')">
      <td>${esc(p.name)}${p.priority === 'גבוהה' ? ' 🔴' : ''}</td>
      <td>${esc(p.institute_name || '')}</td>
      <td><span class="tag ${STATUS_TAG_CLASS[p.status] || 'tag-planned'}">${esc(p.status)}</span></td>
      <td>${avatarStackHtml((Array.isArray(p.team) && p.team.length) ? p.team : (p.owner ? [p.owner] : []), 'sm') || '—'}</td>
      <td class="${overdue ? 'overdue' : ''}">${p.target_date ? esc(p.target_date) : '—'}</td>
      <td>${p.budget ? fmtILS(p.budget) : '—'}</td>
      <td>${prog.total ? `${prog.done}/${prog.total}` : '—'}</td>
    </tr>`;
  }).join('');
  const backLabel = state.role === 'instituteManager' ? esc(instituteName(state.myInstituteId)) : 'כל המכונים';
  return `
    <div class="breadcrumb"><a onclick="backFromOverview()">${backLabel}</a> / סקירה כללית</div>
    <h1>📊 סקירה כללית${state.role === 'instituteManager' ? ' — ' + esc(instituteName(state.myInstituteId)) : ''}</h1>
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-kicker">סה"כ פרויקטים</div><div class="stat-value">${all.length}</div></div>
      <div class="stat-card"><div class="stat-kicker">באיחור</div><div class="stat-value" style="${overdueCount ? 'color:var(--color-accent-700);' : ''}">${overdueCount}</div></div>
      <div class="stat-card"><div class="stat-kicker">תקועים</div><div class="stat-value">${byStatus['תקוע'] || 0}</div></div>
      <div class="stat-card"><div class="stat-kicker">תקציב כולל מוקצה</div><div class="stat-value" style="font-size:17px;">${fmtILS(totalBudget)}</div></div>
    </div>
    <div class="filter-bar">
      <input class="input" placeholder="חיפוש לפי שם, מכון או אחראי…" value="${esc(state.overviewSearch)}" oninput="state.overviewSearch=this.value;render()" style="min-width:240px;">
    </div>
    <div class="card table-wrap">
      <table class="plain">
        <thead><tr><th>פרויקט</th><th>מכון</th><th>סטטוס</th><th>צוות</th><th>יעד</th><th>תקציב</th><th>משימות</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="muted">אין פרויקטים.</td></tr>'}</tbody>
      </table>
    </div>`;
}

function setMyName(name) {
  state.myName = name;
  sessionStorage.setItem(SESSION_KEY + '_myname', name);
}
function clearMyName() {
  state.myName = '';
  sessionStorage.removeItem(SESSION_KEY + '_myname');
  render();
}

async function openMyTasks() {
  state.myTasksFrom = state.view === 'myTasks' ? state.myTasksFrom : state.view;
  state.view = 'myTasks';
  render();
  if (!state.myName) return;
  await fetchMyTasks();
}

async function fetchMyTasks() {
  state.myTasksLoading = true; render();
  try {
    const res = await fetch(TASKS_URL + '?select=' + encodeURIComponent('*,projects(id,name,status,institute_id,institute_name)') + '&assignee=eq.' + encodeURIComponent(state.myName) + '&order=due_date.asc.nullslast', { headers: HEADERS_GET });
    let rows = res.ok ? await res.json() : [];
    if (state.role === 'instituteManager') rows = rows.filter((t) => t.projects && t.projects.institute_id === state.myInstituteId);
    state.myTasks = rows;
  } catch (e) { state.myTasks = []; }
  state.myTasksLoading = false;
  render();
}

function backFromMyTasks() {
  const from = state.myTasksFrom;
  if (from === 'projectList' && state.currentInstituteId) { openInstituteProjects(state.currentInstituteId); return; }
  if (from === 'overview') { openOverview(); return; }
  if (state.role === 'instituteManager') { openInstituteProjects(state.myInstituteId); return; }
  state.view = 'instituteList';
  fetchProjectCounts().then(render);
  render();
}

function myTasksTemplate() {
  if (!state.myName) {
    const opts = state.role === 'instituteManager' ? instituteEmployees(state.myInstituteId) : [];
    return `
    <div class="breadcrumb"><a onclick="backFromMyTasks()">חזרה</a> / המשימות שלי</div>
    <div class="card whoami-card" style="display:flex;flex-direction:column;gap:12px;">
      <div>
        <div style="font-weight:700;">מי אתה/את?</div>
        <div class="muted">כדי להציג רק את המשימות ששויכו אליך, בחר/י או הקלד/י את השם שבו אתה משויך/ת במשימות.</div>
      </div>
      <div class="field">
        <input class="input" id="myNameInput" list="${opts.length ? 'myNameDatalist' : ''}" placeholder="השם המלא שלך" onkeydown="if(event.key==='Enter')submitMyName()">
        ${opts.length ? `<datalist id="myNameDatalist">${opts.map((n) => `<option value="${esc(n)}">`).join('')}</datalist>` : ''}
      </div>
      <button type="button" class="btn btn-primary" onclick="submitMyName()" style="align-self:flex-start;">שמירה והצגת המשימות שלי</button>
    </div>`;
  }
  if (state.myTasksLoading) return `<div class="breadcrumb"><a onclick="backFromMyTasks()">חזרה</a> / המשימות שלי</div><div class="loading-box">טוען…</div>`;
  const rows = state.myTasks.map((t) => `
    <div class="mytasks-row">
      <input type="checkbox" ${t.status === 'הושלם' ? 'checked' : ''} onchange="setMyTaskStatus('${esc(t.id)}', this.checked)">
      <div style="flex:1;">
        <div style="${t.status === 'הושלם' ? 'text-decoration:line-through;opacity:.55;' : ''}">${esc(t.title)}</div>
        <div class="muted">${t.projects ? esc(t.projects.name) + (t.projects.institute_name ? ' · ' + esc(t.projects.institute_name) : '') : ''}${t.due_date ? ' · יעד: ' + esc(t.due_date) : ''}</div>
      </div>
      <button type="button" class="btn btn-sm" onclick="openProjectDetail('${esc(t.project_id)}')">לפרויקט</button>
    </div>`).join('');
  return `
    <div class="breadcrumb"><a onclick="backFromMyTasks()">חזרה</a> / המשימות שלי</div>
    <div class="row" style="margin-bottom:var(--space-4);">
      <h1 style="margin:0;">✅ המשימות שלי — ${esc(state.myName)}</h1>
      <button type="button" class="btn btn-sm" onclick="clearMyName()">זה לא אני / שינוי</button>
    </div>
    <div class="card">${rows || '<div class="muted">לא נמצאו משימות ששויכו לשם הזה.</div>'}</div>`;
}

function submitMyName() {
  const input = document.getElementById('myNameInput');
  const name = input ? input.value.trim() : '';
  if (!name) return;
  setMyName(name);
  fetchMyTasks();
}

async function setMyTaskStatus(taskId, checked) {
  const status = checked ? 'הושלם' : 'ממתין';
  const t = state.myTasks.find((x) => x.id === taskId);
  if (t) t.status = status;
  render();
  try { await fetch(TASKS_URL + '?id=eq.' + encodeURIComponent(taskId), { method: 'PATCH', headers: { ...HEADERS_JSON, Prefer: 'return=minimal' }, body: JSON.stringify({ status }) }); } catch (e) {}
}

async function enterApp() {
  state.screen = 'app';
  if (state.role === 'instituteManager') {
    await openInstituteProjects(state.myInstituteId);
  } else {
    await fetchProjectCounts();
    state.view = 'instituteList';
    render();
  }
  startPolling();
}

async function init() {
  try {
    await fetchAppStateBasics();
  } catch (e) {
    state.fatalError = 'לא ניתן להתחבר לשרת כרגע. בדוק/י חיבור לאינטרנט ורענן/י את הדף.';
    state.screen = 'app';
    render();
    return;
  }
  if (state.role && (state.role !== 'instituteManager' || state.myInstituteId)) {
    // reuse the session only if the expected password key still resolves (institute wasn't deleted meanwhile)
    const key = roleKey(state.role, state.myInstituteId);
    if (state.rolePasswords && key in state.rolePasswords) {
      await enterApp();
      return;
    }
  }
  state.screen = 'login';
  render();
}

init();
</script>
</body>
</html>
